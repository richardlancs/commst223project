<!doctype html>
<html lang="en">

  <main id="main" tabindex="-1">
    <p class="muted center-pad">Opening the office…</p>
  </main>
  <nav class="tabbar" aria-label="Game navigation">
    <button type="button" class="tab" data-nav="home" aria-current="page">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z"/></svg>

    <button type="button" class="tab" data-nav="rules">

  <div class="fx" id="fx" aria-hidden="true"></div>

</html>
